name: Build Reynard iOS 12 (lowmem 1GB)

on:
  push:
    branches: [lowmem-1gb]
    paths-ignore: ['ci-status/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lowmem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both variants, published as separate releases
          # (lowmem-<run>-jemalloc / lowmem-<run>-nojemalloc). Upstream ships
          # nojemalloc for libhooker jailbreaks; jemalloc is kept for testing.
          - variant: jemalloc
            gecko_args: --use-sccache
          - variant: nojemalloc
            gecko_args: --use-sccache --disable-jemalloc
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Select Xcode 26 (Xcode 27 rejects iOS 12 targets)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.x'

      - name: Free disk space
        run: |
          df -h /
          KEEP="$(cd "$(xcode-select -p)/../.." && pwd -P)"
          echo "Keeping $KEEP"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$KEEP" ] || sudo rm -rf "$x" || true
          done
          xcrun simctl delete all >/dev/null 2>&1 || true
          sudo rm -rf "$HOME/Library/Android" "$HOME/.dotnet" /usr/local/share/dotnet \
            "$HOME/.ghcup" "$HOME/Library/Developer/CoreSimulator/Caches" 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          brew install python@3.12 lld cbindgen ldid
          # Gecko 152's bindgen crashes with libclang 23 (Homebrew's current
          # llvm). Use an older LLVM for clang + libclang.
          LLVM_FORMULA=""
          for v in 20 21 19; do
            if brew install "llvm@$v"; then LLVM_FORMULA="llvm@$v"; break; fi
          done
          [ -n "$LLVM_FORMULA" ] || { echo "No suitable llvm@N formula"; exit 1; }
          echo "Using $LLVM_FORMULA"
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix "$LLVM_FORMULA")/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          "$(brew --prefix "$LLVM_FORMULA")/bin/clang" --version
          node --version
          df -h .

      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive support/idevice
          git submodule update --init --depth 1 engine/firefox

      - name: Update Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh < /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
            tools/development/wasi-sdk
          key: gecko-deps-${{ matrix.variant }}-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: gecko-deps-${{ matrix.variant }}-

      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build Gecko
        # Leave time inside the 360 min job limit for the app build and the
        # status report, which otherwise never runs on a job-level timeout.
        timeout-minutes: 330
        env:
          # Apple's ld fails Gecko's linker probe; use Homebrew LLVM + lld
          # like upstream Reynard CI.
          CC: clang
          CXX: clang++
          LD: ld64.lld
          MOZ_NOSPAM: "1"
        run: |
          set -o pipefail
          exec > >(tee -a gecko-build.log) 2>&1
          # The runner's rustup is Homebrew's; its proxies break Gecko's
          # `rustup which rustc` probe. Point Gecko at the real toolchain
          # binaries instead of the proxies.
          which -a rustc rustup cargo || true
          SYSROOT="$(rustc --print sysroot)"
          echo "Rust sysroot: $SYSROOT"
          ls "$SYSROOT/bin"
          ls "$SYSROOT/lib/rustlib"
          export RUSTC="$SYSROOT/bin/rustc" CARGO="$SYSROOT/bin/cargo"
          export PATH="$SYSROOT/bin:$PATH"
          "$RUSTC" --version
          "$CARGO" --version
          # Homebrew LLVM has no iOS compiler-rt; @available() needs
          # __isPlatformVersionAtLeast from libclang_rt.ios.a. Use Xcode's.
          RT_IOS="$(ls -1d "$(xcode-select -p)"/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/*/lib/darwin/libclang_rt.ios.a | tail -n 1)"
          [ -f "$RT_IOS" ] || { echo "libclang_rt.ios.a not found"; exit 1; }
          echo "Using $RT_IOS"
          export LDFLAGS="${LDFLAGS:+$LDFLAGS }$RT_IOS"
          # Homebrew clang otherwise uses Homebrew's own libc++ headers, which
          # reference libc++.dylib symbols that iOS 12 lacks (lowmem-11/12
          # crashed in dyld: Symbol not found basic_ofstream VTT). Use the
          # iOS SDK's libc++ headers, which respect the 12.4 deployment target.
          SDKROOT_IOS="$(xcrun --sdk iphoneos --show-sdk-path)"
          [ -d "$SDKROOT_IOS/usr/include/c++/v1" ] || { echo "SDK libc++ headers not found"; exit 1; }
          echo "Using libc++ headers from $SDKROOT_IOS/usr/include/c++/v1"
          export CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-nostdinc++ -isystem $SDKROOT_IOS/usr/include/c++/v1"
          ./tools/development/build-gecko.sh ${{ matrix.gecko_args }}

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Build app (unsigned)
        timeout-minutes: 30
        run: |
          set -o pipefail
          rm -rf dist && mkdir -p dist
          cp browser/Configuration/Reynard.xcconfig dist/Reynard.xcconfig
          sed -i '' "s/CURRENT_BUILD = .*/CURRENT_BUILD = $(git rev-parse --short=7 HEAD)/" dist/Reynard.xcconfig
          xcodebuild archive -scheme Reynard -project browser/Reynard.xcodeproj \
            -sdk iphoneos -arch arm64 -configuration Release \
            -xcconfig dist/Reynard.xcconfig -archivePath dist/Reynard.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee app-build.log
          SC=dist/Reynard.xcarchive/Products/Applications/Reynard.app/Frameworks/libswift_Concurrency.dylib
          if [ -f "$SC" ]; then
            xcrun bitcode_strip "$SC" -r -o "$SC"
            codesign --force --sign - "$SC"
          fi

      - name: Check for libc++ symbols missing on iOS 12
        run: |
          set -o pipefail
          APP=dist/Reynard.xcarchive/Products/Applications/Reynard.app
          # libc++.dylib exports that appeared after iOS 12 (filesystem: 13,
          # atomic wait: 14, verbose_abort/to_chars float: 16, pmr: 17,
          # __hash_memory: newer libc++), plus the fstream VTT that crashed.
          FAIL_PAT='basic_ofstream|basic_ifstream|basic_fstream|basic_filebuf|__fs10filesystem|__libcpp_verbose_abort|__libcpp_atomic_wait|__cxx_atomic_notify|__cxx_atomic_wait|__libcpp_atomic_monitor|3pmr|__hash_memory|8to_chars|10from_chars'
          WARN_PAT='__itoa|__u32toa|__u64toa|__libcpp_'
          : > libcxx-check.txt
          : > libcxx-warn.txt
          find "$APP" -type f \( -name '*.dylib' -o -name XUL -o -name GeckoView -o -perm -111 \) | while read -r f; do
            file "$f" | grep -q 'Mach-O' || continue
            U=$(xcrun nm -u "$f" 2>/dev/null || true)
            hits=$(echo "$U" | grep -E "$FAIL_PAT" || true)
            if [ -n "$hits" ]; then
              echo "== $f" >> libcxx-check.txt
              echo "$hits" | xcrun c++filt | head -n 40 >> libcxx-check.txt
            fi
            warn=$(echo "$U" | grep -E "$WARN_PAT" | grep -vE "$FAIL_PAT" || true)
            if [ -n "$warn" ]; then
              echo "== $f" >> libcxx-warn.txt
              echo "$warn" | xcrun c++filt | head -n 20 >> libcxx-warn.txt
            fi
          done
          if [ -s libcxx-warn.txt ]; then
            echo "Warning: libc++ imports worth checking against iOS 12:"
            cat libcxx-warn.txt
            cat libcxx-warn.txt >> libcxx-check-warn.txt
          fi
          if [ -s libcxx-check.txt ]; then
            echo "Binaries import libc++ symbols that iOS 12 does not provide:"
            cat libcxx-check.txt
            exit 1
          fi
          echo "No known post-iOS-12 libc++ imports found." | tee libcxx-check.txt

      - name: Create IPA
        run: |
          ./tools/release/create-ipa.sh
          mv dist/Reynard-Jailbroken.ipa "dist/Reynard-Jailbroken-lowmem-${{ matrix.variant }}.ipa"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken-lowmem-${{ matrix.variant }}
          path: dist/Reynard-Jailbroken-lowmem-${{ matrix.variant }}.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lowmem-${{ github.run_number }}-${{ matrix.variant }}
          target_commitish: ${{ github.sha }}
          name: Reynard iOS 12 lowmem build ${{ github.run_number }}
          prerelease: true
          files: dist/Reynard-Jailbroken-lowmem-${{ matrix.variant }}.ipa
          body: |
            Unsigned-then-ldid-signed jailbroken build of libf-de/reynard-browser-ios12 + lowmem-1gb patch.
            jemalloc: try first. nojemalloc: use if jemalloc crashes at launch.
            Commit: ${{ github.sha }}

      # Push log tails to a branch so the build can be debugged without API access.
      - name: Report status
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/status
          {
            echo "run=${{ github.run_number }} attempt=${{ github.run_attempt }} variant=${{ matrix.variant }}"
            echo "job_status=${{ job.status }} sha=${{ github.sha }}"
            date -u
          } > /tmp/status/summary.txt
          for f in libcxx-check.txt libcxx-warn.txt; do [ -f "$f" ] && cp "$f" /tmp/status/ || true; done
          for f in gecko-build.log app-build.log; do
            [ -f "$f" ] && tail -n 400 "$f" > "/tmp/status/$f" || true
          done
          if [ -f gecko-build.log ]; then
            grep -nE "error:|error\[|Error |fatal error|make.*\*\*\*|panicked|signal:|failed to run custom build" gecko-build.log | tail -n 120 > /tmp/status/gecko-errors.txt || true
            grep -v "rerun-if-changed" gecko-build.log | grep -nE -B8 -A40 "failed to run custom build|error\[|error: could not compile|panicked|fatal error|error: " | head -n 1500 > /tmp/status/gecko-error-context.txt || true
            head -n 150 gecko-build.log > /tmp/status/gecko-build-head.log
            gzip -9 -c gecko-build.log > /tmp/status/gecko-build.log.gz || true
          fi
          if [ -f app-build.log ]; then
            grep -nE "error:|BUILD FAILED|\*\* ARCHIVE" app-build.log | tail -n 80 > /tmp/status/app-errors.txt || true
          fi
          BR="ci-status-${{ matrix.variant }}"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          rm -rf /tmp/statusrepo && mkdir /tmp/statusrepo && cd /tmp/statusrepo
          git init -q && git checkout -q -b "$BR"
          cp /tmp/status/* .
          git add -A && git commit -qm "status run ${{ github.run_number }} ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BR"
