name: CI probe (report build run status)

on:
  push:
    branches: [ci-probe]
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect workflow run status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          MSG='${{ github.event.head_commit.message }}'
          RID=$(printf '%s\n' "$MSG" | sed -n 's/^rerun \([0-9][0-9]*\)$/\1/p' | head -1)
          if [ -n "$RID" ]; then
            gh run rerun "$RID" -R "$REPO" > out/rerun.txt 2>&1 || true
            sleep 20
          fi
          date -u > out/when.txt
          gh run list -R "$REPO" --limit 20 \
            --json databaseId,number,workflowName,displayTitle,headBranch,headSha,event,status,conclusion,createdAt,startedAt,updatedAt \
            > out/runs.json || echo "gh run list failed" > out/runs.json
          gh run list -R "$REPO" --limit 20 > out/runs.txt 2>&1 || true
          for id in $(gh run list -R "$REPO" --branch lowmem-1gb --limit 4 --json databaseId -q '.[].databaseId'); do
            gh api "repos/$REPO/actions/runs/$id/jobs" \
              -q '.jobs[] | {name, status, conclusion, started_at, completed_at, runner_name, steps: [.steps[] | {name, status, conclusion, started_at, completed_at}]}' \
              > "out/jobs-$id.json" 2>&1 || true
            gh run view "$id" -R "$REPO" --log-failed 2>&1 | tail -n 300 > "out/failed-$id.log" || true
            gh run view "$id" -R "$REPO" > "out/view-$id.txt" 2>&1 || true
            for jid in $(gh api "repos/$REPO/actions/runs/$id/jobs" -q '.jobs[].id'); do
              gh api "repos/$REPO/check-runs/$jid/annotations" >> "out/annotations-$id.json" 2>&1 || true
              gh api "repos/$REPO/actions/jobs/$jid" -q '{name, labels, runner_group_name, created_at, started_at, completed_at, conclusion}' >> "out/jobmeta-$id.json" 2>&1 || true
            done
          done
          gh api "repos/$REPO/actions/permissions" > out/actions-permissions.json 2>&1 || true
          ls -la out
      - name: Push results
        run: |
          cd out
          git init -q && git checkout -q -b ci-probe-result
          git config --global user.name github-actions
          git config --global user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "probe $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-probe-result

  # Commit message "watch <run id>": keep re-running that build run whenever
  # GitHub cancels it for lack of a macOS runner, until a runner takes it.
  watchdog:
    if: startsWith(github.event.head_commit.message, 'watch ')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Re-run build until a runner picks it up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          RID=$(printf '%s\n' "$MSG" | sed -n 's/^watch \([0-9][0-9]*\)$/\1/p' | head -1)
          [ -n "$RID" ] || exit 0
          for i in $(seq 1 330); do
            J=$(gh api "repos/$REPO/actions/runs/$RID/jobs" -q '[.jobs[] | {s: .status, c: .conclusion, r: .runner_name}]')
            ST=$(gh api "repos/$REPO/actions/runs/$RID" -q .status)
            echo "$(date -u +%T) run=$ST jobs=$J"
            if echo "$J" | grep -q '"r":"[^"]\+"'; then echo "runner assigned"; exit 0; fi
            if [ "$ST" = completed ]; then
              if echo "$J" | grep -q '"c":"success"'; then exit 0; fi
              gh run rerun "$RID" -R "$REPO" || gh run rerun "$RID" -R "$REPO" --failed || true
              sleep 30
            fi
            sleep 60
          done
